[project]
name = "mini-memory"
version = "0.4.0"
description = "AI 기억 설계 실습의 미니 메모리 (실습 03에서 시작해 한 편씩 자란다)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=2.3,<3",
]

[project.scripts]
mm = "mini_memory.cli:mm"
mini-memory = "mini_memory.cli:mini_memory"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
